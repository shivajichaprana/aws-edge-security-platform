# Checkov configuration for aws-edge-security-platform.
#
# Every suppression below is listed with the reason it does not apply here.
# Anything not listed is expected to pass.

directory:
  - terraform
framework:
  - terraform
quiet: true
download-external-modules: false
soft-fail: false
compact: true

skip-check:
  # --- Lambda@Edge: these five are not choices, they are platform limits ---
  # The functions in modules/lambda-edge are Lambda@Edge, replicated by CloudFront
  # into every edge location. Lambda@Edge does not support dead letter queues,
  # code-signing configurations, VPC attachment, reserved concurrency, or active
  # X-Ray tracing on the function. Terraform will accept these arguments and AWS
  # will then refuse the association, so "fixing" any of them would break the
  # deployment rather than harden it.
  - CKV_AWS_116   # Lambda has no dead letter queue
  - CKV_AWS_272   # Lambda code-signing not configured
  - CKV_AWS_117   # Lambda not inside a VPC
  - CKV_AWS_115   # Lambda has no function-level concurrency limit
  - CKV_AWS_50    # X-Ray tracing not enabled on Lambda

  # --- CloudFront ---
  # The viewer certificate is the default *.cloudfront.net one unless the caller
  # passes var.acm_certificate_arn. AWS fixes the minimum protocol version at
  # TLSv1 for that certificate and rejects any attempt to raise it; supply an ACM
  # certificate and the module pins TLSv1.2_2021. See modules/cloudfront/main.tf.
  - CKV_AWS_174   # viewer certificate below TLS 1.2
  # Origin failover needs a second, independent origin to fail over to. This
  # module fronts one ALB, supplied by the caller, so an origin group would be a
  # group of one and would buy nothing.
  - CKV_AWS_310   # no origin failover configured
  # geo_restriction is deliberately "none". Geography is handled at the edge by
  # the geo-router Lambda@Edge in modules/lambda-edge, which can route rather than
  # only block, and can be changed without a distribution update.
  - CKV_AWS_374   # no geo restriction on the distribution

  # --- IAM ---
  # The WAF-logs Firehose role writes to its own log group. A CloudWatch Logs
  # group ARN has to carry a ":*" suffix to cover the streams inside it - that is
  # the documented form, not a wildcard grant. Every other statement in that
  # policy names an explicit ARN.
  - CKV_AWS_111   # IAM write access without constraints
  - CKV_AWS_356   # wildcard resource for restrictable actions

  # --- KMS ---
  # A customer-managed key per WAF web ACL adds key rotation and grant management
  # for data that is already encrypted with an AWS-managed key and never leaves
  # the account.
  - CKV_AWS_109   # KMS key policy allows broad access

  # --- CloudWatch retention: the audit trail is in S3, not in these groups ---
  # The retention that matters for an audit is the 365-day lifecycle on the WAF
  # log Parquet files in S3 (modules/waf-logs/variables.tf, log_retention_days).
  # The two groups this check hits are operational, not evidential: Firehose
  # delivery errors, kept 14 days, and Lambda@Edge stdout, kept 30. Lambda@Edge
  # replicates into every edge region and each one gets its own log group, so a
  # year of debug output would be billed roughly twenty times over for nothing.
  - CKV_AWS_338   # log group retains logs for less than a year
  # Same three Lambda@Edge groups. Terraform only pre-creates the us-east-1 one;
  # AWS creates the rest automatically, in each region, out of Terraform's reach.
  # A CMK here would encrypt one copy of roughly twenty and would read as broader
  # coverage than it is. The Firehose group, which carries the WAF data path, is
  # encrypted with the waf_logs CMK.
  - CKV_AWS_158   # log group not encrypted with a CMK

  # --- CloudFront response headers ---
  # Security headers are set by the security_headers Lambda@Edge function on
  # viewer-response (modules/lambda-edge/main.tf). That is what this repository is
  # for. A response headers policy would be a second, competing source of the same
  # headers.
  - CKV2_AWS_32   # distribution has no response headers policy

  # --- S3: log buckets are not ordinary buckets ---
  # Access logging on a log bucket writes into a log bucket. Pointing it at itself
  # recurses, and a third bucket would raise the same finding again. Object access
  # is already captured by CloudTrail data events.
  - CKV_AWS_18    # S3 bucket has no access logging
  # Nothing subscribes to object events here. The Glue crawler runs on a schedule
  # (04:00 UTC daily) because partitioned Parquet is crawled by prefix, not by file.
  - CKV2_AWS_62   # S3 bucket has no event notifications
  # Cross-region replication would double the storage bill for data that is already
  # expiring - the Athena results bucket clears at 7 days and the WAF logs at 365.
  # Neither is a system of record.
  - CKV_AWS_144   # S3 bucket has no cross-region replication

  # --- False positive ---
  # The web ACL already includes AWSManagedRulesKnownBadInputsRuleSet, which is the
  # rule group carrying the Log4j signatures - see modules/waf/main.tf, rule
  # "AWSManagedRulesKnownBadInputsRuleSet". Checkov's graph check does not follow it
  # across the module boundary and reports the distribution as unprotected.
  - CKV2_AWS_47   # WAF has no Log4j vulnerability rule
